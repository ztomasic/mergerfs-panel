name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and package sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        timeout-minutes: 5
        run: |
          sudo timeout 120 apt-get update -qq || true
          sudo DEBIAN_FRONTEND=noninteractive timeout 150 apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 python3-venv desktop-file-utils || true
          # Optional: enables the live pool tests when the package exists.
          sudo DEBIAN_FRONTEND=noninteractive timeout 90 apt-get install -y --no-install-recommends mergerfs \
            || echo "mergerfs unavailable; live pool tests will skip"

      - name: Unit and integration tests
        timeout-minutes: 5
        run: PYTHONPATH=app/src timeout 240 python3 -m unittest discover -s app/tests -v

      - name: Validate desktop entry
        run: |
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate app/data/mergerfs-panel.desktop
          else
            echo "desktop-file-validate unavailable; skipping"
          fi

      - name: Build wheel
        timeout-minutes: 5
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip build
          /tmp/venv/bin/python -m build --wheel --outdir dist app

      - name: Inspect wheel
        run: |
          /tmp/venv/bin/python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "mergerfs_panel/__main__.py" in names
          assert any(name.endswith("entry_points.txt") for name in names)
          print(wheel, "contains", len(names), "files")
          PY
